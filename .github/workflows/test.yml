name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    # The actions run on the runner's own python3, so test with that rather than a setup-python version.
    - name: Set up dataset-sync
      run: ./setup.sh
    - name: Run tests
      run: '"$DATASET_SYNC_PYTHON" -m unittest discover -s tests -v'
